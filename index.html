<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OOSE GATE Practice Quiz</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    padding:20px;
    font-family:Arial,sans-serif;
    background:#f2f4f7;
    color:#222;
}

.container{
    max-width:750px;
    margin:20px auto;
    background:white;
    padding:28px;
    border-radius:16px;
    box-shadow:0 4px 20px #ccc;
}

h1{text-align:center}
h2{line-height:1.4}

.subtitle{
    text-align:center;
    color:#666;
}

input{
    width:100%;
    padding:14px;
    margin:8px 0 15px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

button{
    border:0;
    border-radius:8px;
    padding:14px;
    font-size:16px;
    cursor:pointer;
}

.start-btn,.next-btn,.restart-btn{
    width:100%;
    background:#222;
    color:white;
}

.option{
    width:100%;
    display:block;
    text-align:left;
    margin:10px 0;
    background:#eee;
    transition:.2s;
}

.option:hover{
    background:#ddd;
}

.option:disabled{
    cursor:not-allowed;
}

.correct{
    background:#b7e4c7 !important;
}

.wrong{
    background:#ffb3b3 !important;
}

#quiz,#result{
    display:none;
}

.progress{
    font-weight:bold;
    margin-bottom:10px;
}

.chapter{
    text-align:center;
    color:#666;
    margin-bottom:15px;
}

.feedback{
    font-weight:bold;
    font-size:18px;
    margin:18px 0;
    min-height:25px;
}

.score{
    text-align:center;
    font-size:24px;
    font-weight:bold;
}

.details{
    background:#f5f5f5;
    padding:15px;
    border-radius:10px;
    margin:20px 0;
}
</style>
</head>

<body>

<div class="container">

<!-- START PAGE -->
<div id="start">

<h1>OOSE GATE Practice Quiz</h1>

<p class="subtitle">
180 MCQs • 6 Chapters • GATE Practice
</p>

<label><b>Name</b></label>
<input type="text" id="name" placeholder="Enter your Name">

<label><b>Email ID</b></label>
<input type="email" id="email" placeholder="Enter your Email ID">

<button class="start-btn" onclick="startQuiz()">
Start Quiz
</button>

</div>


<!-- QUIZ PAGE -->
<div id="quiz">

<div class="progress" id="progress"></div>

<div class="chapter" id="chapter"></div>

<h2 id="question"></h2>

<div id="options"></div>

<div class="feedback" id="feedback"></div>

<button class="next-btn" id="nextButton" onclick="nextQuestion()">
Next
</button>

</div>


<!-- RESULT PAGE -->
<div id="result">

<h1>🎉 Quiz Completed!</h1>

<div class="details">

<p>
<b>Name:</b>
<span id="finalName"></span>
</p>

<p>
